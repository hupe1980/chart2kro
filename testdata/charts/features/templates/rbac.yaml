apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: features-shared-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "features.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: features-shared-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "features.fullname" . }}
    namespace: {{ .Release.Namespace }}
