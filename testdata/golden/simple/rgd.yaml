apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: simple
  annotations:
    chart2kro.io/chart: simple-1.0.0
  labels:
    app.kubernetes.io/managed-by: chart2kro
spec:
  resources:
    - id: deployment
      readyWhen:
        - ${deployment.status.?availableReplicas.orValue(0) == deployment.spec.?replicas.orValue(1)}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}-simple
        spec:
          replicas: ${schema.spec.replicaCount}
          selector:
            matchLabels:
              app: simple
              app.kubernetes.io/instance: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: simple
                app.kubernetes.io/instance: ${schema.metadata.name}
            spec:
              containers:
                - name: simple
                  image: ${schema.spec.image.repository}:${schema.spec.image.tag}
                  ports:
                    - containerPort: ${schema.spec.service.port}
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-simple
        spec:
          ports:
            - port: ${schema.spec.service.port}
              targetPort: ${schema.spec.service.port}
          selector:
            app: simple
            app.kubernetes.io/instance: ${schema.metadata.name}
          type: ${schema.spec.service.type}
  schema:
    apiVersion: v1alpha1
    kind: Simple
    group: kro.run
    spec:
      image:
        repository: string | default="nginx"
        tag: string | default="1.21"
      replicaCount: integer | default=1
      service:
        port: integer | default=80
        type: string | default="ClusterIP"
