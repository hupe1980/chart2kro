name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit, golden and integration tests
        run: go test -race -count=1 ./...
      - name: Coverage floor (80 % per package)
        run: |
          go test -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./internal/... ./pkg/... > /dev/null
          go run ./hack/coverfloor -profile coverage.out -min 80
      - name: Examples are up to date
        run: |
          for d in examples/*/; do d="${d%/}"; go run ./cmd/chart2kro convert "$d/chart" -o "$d" --check -q; done

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release-config:
    name: Workflows and release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Actions are pinned by commit SHA
        run: |
          if grep -hE '^\s+(- )?uses: ' .github/workflows/*.yaml | grep -vE '@[0-9a-f]{40} # v|uses: \./'; then
            echo "::error::pin every action to a full commit SHA with a '# vX.Y.Z' comment"; exit 1
          fi
      - name: No references to removed commands or local planning folders
        run: |
          if git ls-files | grep -vE '^(CHANGELOG\.md|\.gitignore|\.github/workflows/ci\.yaml)$|_test\.go$' \
            | xargs grep -nE '(^|[^/a-z])(concepts|specs)/|--harden|--flat-schema|--repo-url|chart2kro (audit|plan|export|watch|docs) '; then
            echo "::error::remove the references above"; exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.19.0"
          args: check

  e2e:
    name: E2E (kind + kro ${{ matrix.kro }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        kro: ["0.9.1", "0.9.4"] # oldest supported and the pinned library version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kro
        run: helm install kro oci://registry.k8s.io/kro/charts/kro --version "${{ matrix.kro }}" -n kro-system --create-namespace --wait
      - name: E2E
        run: go test -tags e2e -count=1 -timeout 30m -v ./test/e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, vuln]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -o chart2kro ./cmd/chart2kro
      - run: ./chart2kro version
