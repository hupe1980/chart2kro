apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: redis
  annotations:
    chart2kro.io/chart: redis-0.1.0
  labels:
    app.kubernetes.io/managed-by: chart2kro
spec:
  resources:
    - id: configMap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-redis-config
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
        data:
          redis.conf: |
            maxmemory-policy ${schema.spec.maxmemoryPolicy}
            appendonly yes
            appendfilename "appendonly.aof"
            save 900 1
            save 300 10
            save 60 10000
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-redis
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
        spec:
          ports:
            - name: redis
              port: ${schema.spec.service.port}
              protocol: TCP
              targetPort: redis
          selector:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
          type: ${schema.spec.service.type}
    - id: serviceHeadless
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-redis-headless
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
        spec:
          clusterIP: None
          ports:
            - name: redis
              port: ${schema.spec.service.port}
              protocol: TCP
              targetPort: redis
          selector:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
          type: ClusterIP
    - id: statefulSet
      readyWhen:
        - ${statefulSet.status.?readyReplicas.orValue(0) == statefulSet.spec.?replicas.orValue(1)}
      template:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: ${schema.metadata.name}-redis
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: redis
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}
              app.kubernetes.io/name: redis
          serviceName: ${schema.metadata.name}-redis-headless
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: ${schema.metadata.name}
                app.kubernetes.io/name: redis
            spec:
              containers:
                - name: redis
                  command:
                    - redis-server
                    - /etc/redis/redis.conf
                  image: ${schema.spec.image.repository}:${schema.spec.image.tag}
                  imagePullPolicy: ${schema.spec.image.pullPolicy}
                  livenessProbe:
                    initialDelaySeconds: 15
                    periodSeconds: 10
                    tcpSocket:
                      port: redis
                  ports:
                    - name: redis
                      containerPort: 6379
                      protocol: TCP
                  readinessProbe:
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    tcpSocket:
                      port: redis
                  resources:
                    limits:
                      cpu: ${schema.spec.resources.limits.cpu}
                      memory: ${schema.spec.resources.limits.memory}
                    requests:
                      cpu: ${schema.spec.resources.requests.cpu}
                      memory: ${schema.spec.resources.requests.memory}
                  volumeMounts:
                    - name: redis-config
                      mountPath: /etc/redis
                    - name: redis-data
                      mountPath: /data
              volumes:
                - name: redis-config
                  configMap:
                    name: ${schema.metadata.name}-redis-config
          volumeClaimTemplates:
            - metadata:
                name: redis-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: ${schema.spec.persistence.size}
  schema:
    apiVersion: v1alpha1
    kind: Redis
    group: kro.run
    spec:
      image:
        pullPolicy: string | default="IfNotPresent" description="Image pull policy"
        repository: string | default="redis" description="Container image repository"
        tag: string | default="7.4-alpine" description="Container image tag"
      maxmemoryPolicy: string | default="allkeys-lru" description="Eviction policy when maxmemory is reached"
      persistence:
        size: string | default="1Gi" immutable=true description="Size of the data volume (immutable after creation)"
      resources:
        limits:
          cpu: string | default="500m"
          memory: string | default="512Mi"
        requests:
          cpu: string | default="100m"
          memory: string | default="128Mi"
      service:
        port: integer | default=6379 description="Redis port"
        type: string | default="ClusterIP" description="Service type"
