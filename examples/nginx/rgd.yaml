apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: nginx
  annotations:
    chart2kro.io/chart: nginx-0.1.0
  labels:
    app.kubernetes.io/managed-by: chart2kro
spec:
  resources:
    - id: configMap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.metadata.name}-nginx-config
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: nginx
        data:
          default.conf: |2
            server {
              listen 80;
              server_name _;
              location / {
                root /usr/share/nginx/html;
                index index.html;
              }
              location /health {
                return 200 'ok';
                add_header Content-Type text/plain;
              }
            }
    - id: deployment
      readyWhen:
        - ${deployment.status.?availableReplicas.orValue(0) == deployment.spec.?replicas.orValue(1)}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}-nginx
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: nginx
        spec:
          replicas: ${schema.spec.replicaCount}
          selector:
            matchLabels:
              app.kubernetes.io/instance: ${schema.metadata.name}
              app.kubernetes.io/name: nginx
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: ${schema.metadata.name}
                app.kubernetes.io/name: nginx
            spec:
              containers:
                - name: nginx
                  image: ${schema.spec.image.repository}:${schema.spec.image.tag}
                  imagePullPolicy: ${schema.spec.image.pullPolicy}
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  ports:
                    - name: http
                      containerPort: 80
                      protocol: TCP
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: http
                    initialDelaySeconds: 3
                    periodSeconds: 5
                  resources:
                    limits:
                      cpu: ${schema.spec.resources.limits.cpu}
                      memory: ${schema.spec.resources.limits.memory}
                    requests:
                      cpu: ${schema.spec.resources.requests.cpu}
                      memory: ${schema.spec.resources.requests.memory}
                  volumeMounts:
                    - name: nginx-config
                      mountPath: /etc/nginx/conf.d
              volumes:
                - name: nginx-config
                  configMap:
                    name: ${schema.metadata.name}-nginx-config
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-nginx
          labels:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: nginx
        spec:
          ports:
            - name: http
              port: ${schema.spec.service.port}
              protocol: TCP
              targetPort: http
          selector:
            app.kubernetes.io/instance: ${schema.metadata.name}
            app.kubernetes.io/name: nginx
          type: ${schema.spec.service.type}
  schema:
    apiVersion: v1alpha1
    kind: Nginx
    group: kro.run
    spec:
      image:
        pullPolicy: string | default="IfNotPresent" description="Image pull policy (Always, IfNotPresent or Never)"
        repository: string | default="nginx" description="Container image repository"
        tag: string | default="1.27" description="Container image tag"
      replicaCount: integer | default=1 description="Number of nginx pods"
      resources:
        limits:
          cpu: string | default="250m"
          memory: string | default="256Mi"
        requests:
          cpu: string | default="100m"
          memory: string | default="128Mi"
      service:
        port: integer | default=80 description="Service port"
        type: string | default="ClusterIP" description="Service type (ClusterIP, NodePort or LoadBalancer)"
