# -- Number of nginx pods
replicaCount: 1

image:
  # -- Container image repository
  repository: nginx
  # -- Container image tag
  tag: "1.27"
  # -- Image pull policy (Always, IfNotPresent or Never)
  pullPolicy: IfNotPresent

service:
  # -- Service type (ClusterIP, NodePort or LoadBalancer)
  type: ClusterIP
  # -- Service port
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# -- nginx server configuration (default.conf)
config: |
  server {
    listen 80;
    server_name _;
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
